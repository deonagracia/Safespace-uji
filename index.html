<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<title>SafeSpace · Uji desain</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;
--bg:#F4F6F8;--bg2:#E9EDF1;--card:#FFFFFF;--ink:#1E2A33;--body:#3D4A54;--muted:#66727C;--line:#DCE2E7;
--maroon:#2E4A62;--maroon2:#3C5D78;--teal:#2F6F6B;--tealsoft:#E3EFEC;--warn:#FFF4DB;--warnink:#6A4A12;--ok:#2F6B4F}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--body);font:16px/1.55 'DM Sans',Arial,sans-serif;overflow-x:clip}
h1,h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:var(--maroon);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,7vw,42px)}h2{font-size:clamp(24px,5vw,30px)}
h3{font-size:18px;color:var(--ink);margin:0}
p{margin:0}a{color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;font-weight:700;min-height:50px;padding:10px 20px;border-radius:14px;border:2px solid var(--maroon);background:var(--maroon);color:#FFFFFF;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
button.ghost{background:transparent;color:var(--maroon)}
button.block{width:100%}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--teal);text-decoration:underline;font-weight:500;min-height:44px;padding:6px;cursor:pointer}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;color:var(--ink)}
input[type=text],textarea{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);min-height:50px;width:100%}
textarea{min-height:96px;resize:vertical}
.check{flex-direction:row;align-items:flex-start;gap:12px;font-weight:400;cursor:pointer}
.check input{width:24px;height:24px;margin-top:1px;flex:none;accent-color:var(--teal)}
.note{border-left:4px solid var(--maroon);padding:10px 14px;background:var(--card);border-radius:0 12px 12px 0;font-size:15px}
.warn{background:var(--warn);color:var(--warnink);border-radius:12px;padding:12px 16px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;font-weight:500;min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip.sel{background:var(--teal);border-color:var(--teal);color:#F7FAF8}
.sheet-bg{position:fixed;inset:0;background:rgba(20,18,16,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:86dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 20px 24px;display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
/* ===== kartu peran ===== */
.kartu{display:flex;flex-direction:column;gap:8px}
.kartu .ktag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.kartu h3{font-size:17px;color:var(--ink)}
.kartu .kmuted{font-size:13px;color:var(--muted)}
.kartu ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.kartu li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px;color:var(--body);transition:opacity .2s}
.kartu li .n{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.kartu li .a{font-weight:700;color:var(--ink);text-align:right;white-space:nowrap;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--tealsoft)}
.kartu li.done{opacity:.38}
.kartu li.done .n{color:var(--ok)}
/* ===== prototipe SafeSpace ===== */
.phone{width:390px;height:min(780px,calc(100dvh - 150px));min-height:560px;border:10px solid #1F2A2E;border-radius:46px;background:#FFFFFF;color:#1F2A2E;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 22px 50px rgba(42,37,34,.16)}
.phone.full{width:100%;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 10px;background:#F1F4F2;flex:none}
.sbar .logo{font-family:'DM Serif Display',Georgia,serif;font-size:21px;color:#24504D}
.sos{font:inherit;font-size:13px;font-weight:700;border:1.5px solid #B3412F;color:#B3412F;border-radius:999px;padding:4px 12px;background:transparent;min-height:34px;cursor:pointer}
.pad{padding:18px 18px 28px;display:flex;flex-direction:column;gap:14px}
.phone h4{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:28px;color:#24504D;margin:0;line-height:1.15}
.anon{align-self:flex-start;font-size:12px;font-weight:700;color:#2F6F6B;background:#E3EEEC;padding:5px 11px;border-radius:999px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meta div{background:#F1F4F2;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.meta b{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:26px;color:#24504D;line-height:1}
.meta span{font-size:12px;color:#5E6A6E}
.stem{font-size:14px;color:#5E6A6E}
.sec{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#2F6F6B;margin-top:6px}
.item{background:#fff;border:1.5px solid #E1E6E4;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,background .2s;scroll-margin:90px}
.item.ok{border-color:#B9D3CF;background:#F7FBFA}
.item.miss{border-color:#B3412F;background:#FCEFEB}
.item .qt{font-weight:500;color:#1F2A2E;display:flex;gap:10px;line-height:1.4}
.item .no{flex:none;width:26px;height:26px;border-radius:50%;background:#F1F4F2;color:#5E6A6E;font-size:13px;font-weight:700;display:grid;place-items:center;transition:background .2s}
.item.ok .no{background:#2F6F6B;color:#fff}
.item.miss .no{background:#B3412F;color:#fff}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts1{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-size:14px;font-weight:500;min-height:50px;padding:8px 10px;border-radius:12px;border:1.5px solid #D3DBD8;background:#FFFFFF;color:#1F2A2E;text-align:left;line-height:1.25;cursor:pointer;display:flex;align-items:center;gap:9px;justify-content:flex-start;transition:background .15s,border-color .15s,color .15s}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #A7B1B0;background:#fff}
.opt.sel{background:#2F6F6B;border-color:#2F6F6B;color:#fff}
.opt.sel .dot{border-color:#fff;background:radial-gradient(circle,#2F6F6B 0 4px,#fff 5px)}
.opt.big{font-size:17px;min-height:56px;padding:12px 16px;border-radius:16px;gap:12px}
.opt.big .dot{width:22px;height:22px}
.stick{position:sticky;top:0;z-index:2;background:rgba(251,251,246,.97);padding:10px 18px 12px;border-bottom:1px solid #E1E6E4;display:flex;flex-direction:column;gap:8px}
.stick .bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.stick .bar2 span{color:#5E6A6E;font-size:14px}
.back{font:inherit;font-size:15px;font-weight:700;border:0;background:none;color:#2F6F6B;padding:4px 0;min-height:36px;cursor:pointer;align-self:flex-start;justify-content:flex-start}
.prog{height:8px;background:#E1E6E4;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:#2F6F6B;border-radius:4px;transition:width .25s}
.pbtn{font:inherit;font-size:16px;font-weight:700;min-height:54px;border-radius:14px;border:0;background:#2F6F6B;color:#FFFFFF;width:100%;cursor:pointer}
.pbtn.alt{background:transparent;border:2px solid #2F6F6B;color:#2F6F6B}
.bnav{display:flex;justify-content:space-around;border-top:1px solid #E1E6E4;padding:10px 0 calc(10px + env(safe-area-inset-bottom));font-size:12px;color:#5E6A6E;background:#FFFFFF;flex:none}
.bnav b{color:#24504D}
.bnav button{font:inherit;font-size:12px;font-weight:500;background:none;border:0;color:#5E6A6E;min-height:36px;padding:4px 14px;border-radius:10px;cursor:pointer}
.bnav button.on{color:#24504D;font-weight:700;background:#E3EFEC}
.brandhero{display:flex;flex-direction:column;gap:6px;padding:28px 0 8px}
.logo2{font-family:'DM Serif Display',Georgia,serif;font-size:40px;color:#24504D;line-height:1}
.kode{font-family:'DM Serif Display',Georgia,serif;font-size:44px;color:#24504D;letter-spacing:.04em;line-height:1}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mood button{font:inherit;font-weight:500;justify-content:center;background:#fff;border:1.5px solid #E1E6E4;border-radius:12px;min-height:64px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#1F2A2E}
.mood small{font-size:10px;line-height:1.1;color:#5E6A6E;text-align:center}
.face{width:24px;height:24px;border-radius:50%;background:#2F6F6B}
.face.f0{opacity:.25}.face.f1{opacity:.42}.face.f2{opacity:.6}.face.f3{opacity:.8}.face.f4{opacity:1}
.chart{width:100%;height:auto;display:block}
.hist{display:flex;flex-direction:column}
.hist div{display:grid;grid-template-columns:62px 1fr;gap:2px 8px;padding:8px 0;border-bottom:1px solid #E1E6E4;font-size:13px}
.hist div span:first-child{grid-row:span 2;font-weight:700;color:#1F2A2E}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chips2 button{font:inherit;font-size:13px;font-weight:500;min-height:38px;padding:6px 12px;border-radius:999px;border:1.5px solid #D3DBD8;background:#fff;color:#1F2A2E;cursor:pointer}
.chips2 button.on{background:#2F6F6B;border-color:#2F6F6B;color:#fff}
.share{display:flex;flex-direction:column;gap:10px}
.share button{font:inherit;font-weight:400;justify-content:flex-start;text-align:left;display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid #D3DBD8;border-radius:16px;padding:14px;cursor:pointer;color:#1F2A2E;min-height:0}
.share button span:last-child{display:flex;flex-direction:column;gap:4px}
.share small{font-size:13px;color:#5E6A6E;line-height:1.4}
.share button .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #A7B1B0;margin-top:2px}
.share button.on{border-color:#2F6F6B;background:#F3F8F7}
.share button.on .dot{border-color:#2F6F6B;background:radial-gradient(circle,#2F6F6B 0 5px,#fff 6px)}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.pbtn.danger{background:#B3412F}
.linkbtn2{font:inherit;font-size:14px;font-weight:700;background:none;border:0;color:#2F6F6B;padding:0;min-height:32px;cursor:pointer;align-self:flex-start}
.lvl{border-radius:16px;padding:14px;background:#F1F4F2;display:flex;flex-direction:column;gap:6px}
.lvl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvl strong{font-size:22px;color:#24504D;font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.meter{height:8px;background:#E1E6E4;border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:#2F6F6B;border-radius:4px}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.qcard{font-size:21px;font-weight:700;color:#1F2A2E;line-height:1.3}
.role{background:#FFF3D6;color:#6B4510;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500}
.toast{position:absolute;left:12px;right:12px;bottom:76px;background:#1F2A2E;color:#F7FAF8;padding:11px 14px;border-radius:12px;font-size:14px;z-index:5;animation:fin .2s ease-out}
.slide{animation:slide .22s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(16px)}}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.prog i,.item,.opt{transition:none}.slide,.toast,.sheet{animation:none}}
.pmodal{position:absolute;inset:0;background:rgba(31,42,46,.45);display:flex;align-items:flex-end;z-index:8;animation:fin .18s ease-out}
.pmbox{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px 18px 24px;display:flex;flex-direction:column;gap:10px}
.pmbox .pmt{font-size:19px;font-weight:700;color:#1F2A2E}
.back.bk{border:1.5px solid #B9D3CF;background:#F3F8F7;border-radius:999px;padding:4px 14px;min-height:38px;font-size:14px}
.back.bk:disabled{opacity:.35;cursor:default}

/* ===== alur peserta ===== */
.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:'DM Serif Display',Georgia,serif;font-size:20px;color:var(--maroon)}
.stepno{font-size:13px;color:var(--muted);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:3px;transition:width .3s}
.hero{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.lead{font-size:18px;color:var(--ink)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.callout{background:var(--tealsoft);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.callout b{font-size:17px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo div{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.duo .yes{border:1.5px solid var(--teal)}.duo .no{border:1.5px dashed var(--line);color:var(--muted)}
.duo b{font-size:14px}
.plan{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.plan li{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.plan li::before{counter-increment:s;content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--tealsoft);color:var(--teal);font-weight:700;display:grid;place-items:center}
.plan b{color:var(--ink)}
.q{display:flex;flex-direction:column;gap:10px}
.q>p{font-weight:700;color:var(--ink)}
.foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:22px 0 calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:3}
.foot .muted{text-align:center}
.susq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s}
.susq.done{border-color:var(--teal)}
.susq p{color:var(--ink)}
.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.likert button{background:#fff;color:var(--teal);border:1.5px solid var(--line);padding:0;min-height:50px;font-size:18px;border-radius:12px}
.likert button.sel{background:var(--teal);color:#F7FAF8;border-color:var(--teal)}
.lk{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-card{font:inherit;font-weight:400;text-align:left;align-items:stretch;justify-content:flex-start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;color:var(--body);min-height:0}
.opt-card.sel{border-color:var(--teal);background:var(--tealsoft)}
.opt-card b{color:var(--ink);font-size:16px}
.mini{height:96px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.mini i{display:block;height:9px;border-radius:3px;background:var(--line)}
.mini i.t{background:var(--teal);opacity:.55;width:70%}
.mini .big{height:26px;border-radius:5px;border:1.5px solid var(--teal);background:transparent}
.same{grid-column:1/-1}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--teal);animation:sp .9s linear infinite;align-self:center}
@keyframes sp{to{transform:rotate(360deg)}}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--tealsoft);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;align-self:flex-start;font-weight:500}
.preview{background:#1E2A33;color:#EEF2F5;font-size:13px;text-align:center;padding:6px 12px}
details.card summary{cursor:pointer;min-height:40px;display:flex;align-items:center;color:var(--teal);font-weight:700}
/* ===== layar percobaan ===== */
body.trial{overflow:hidden}
.tview{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.tbar{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:#1E2A33;color:#EEF2F5;flex:none}
.tb-l{display:flex;flex-direction:column;gap:1px}
.tag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A9C7E0}
.tbar b{font-size:15px}
.tbar button{min-height:42px;padding:6px 16px;font-size:15px;border-radius:12px;background:#EEF2F5;color:#1E2A33;border-color:#EEF2F5}
.hint{background:var(--warn);color:var(--warnink);font-size:14px;padding:8px 14px;text-align:center;flex:none}
.hint.ok{background:#DDEDE6;color:#1F4D3A}
.tstage{flex:1;min-height:0;display:flex;flex-direction:column}
.phwrap{flex:1;min-height:0;display:flex}
.phwrap>.phone{flex:1}
.kpanel{flex:none;height:27dvh;position:relative;overflow:auto;background:var(--card);border-top:1px solid var(--line);padding:12px 16px 16px;box-shadow:0 -6px 18px rgba(42,37,34,.08)}
@media(min-width:900px){.tstage{flex-direction:row;justify-content:center;align-items:flex-start;gap:32px;padding-top:20px}.phwrap{flex:none}.phwrap>.phone{flex:none}.kpanel{order:-1;height:auto;max-height:calc(100dvh - 150px);width:330px;border:1px solid var(--line);border-radius:18px;box-shadow:none}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}.bar i,.susq{transition:none}}
</style>
</head>

}
function tickKartu(root, ans) {
  if (!root) return;
  $$(".kartu li", root).forEach((li, i) => { const d = ans[i] != null; li.classList.toggle("done", d); $(".n", li).textContent = d ? "✓" : i + 1; });
  const next = $(".kartu li:not(.done)", root);
  if (next && root.scrollHeight > root.clientHeight) root.scrollTo({ top: Math.max(0, next.offsetTop - 8), behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" });
}
function openSheet(html, { onClose, closeText = "Tutup" } = {}) {
  const o = document.createElement("div"); o.className = "sheet-bg";
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${html}<button class="ghost block" data-x>${closeText}</button></div>`;
  const close = () => { o.remove(); document.removeEventListener("keydown", key); onClose && onClose(); };
  const key = e => { if (e.key === "Escape") close(); };
  o.addEventListener("click", e => { if (e.target === o || e.target.closest("[data-x]")) close(); });
  document.addEventListener("keydown", key);
  document.body.append(o); return { el: o, close };
}

/* Penyimpanan: Google Apps Script, atau mode pratinjau (data di browser ini) */
const API = (() => {
  const PKEY = "ss_preview_db";
  const pv = () => store.json(PKEY, { next: 1, rows: {}, pending: {} });
  const pvSave = d => store.set(PKEY, JSON.stringify(d));
  function chooseOrder(rows, pending) {
    const now = Date.now(), c = { "A→B": 0, "B→A": 0 };
    Object.values(rows).forEach(r => { if (!r.latihan && c[r.urutan] != null) c[r.urutan]++; });
    Object.values(pending).forEach(p => { if (now - p.t < 45 * 60e3 && c[p.urutan] != null) c[p.urutan]++; });
    return c["A→B"] <= c["B→A"] ? "A→B" : "B→A";
  }
  async function call(url, params, body) {
    const q = new URLSearchParams(params).toString();
    const res = await fetch(url + (url.includes("?") ? "&" : "?") + q, body ? { method: "POST", body: JSON.stringify(body) } : {});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json(); if (!j.ok) throw new Error(j.error || "gagal");
    return j;
  }
  return {
    preview: url => !url,
    async assign(url, latihan) {
      if (url) return call(url, { action: "assign", latihan: latihan ? 1 : 0 });
      const d = pv();
      if (latihan) return { ok: true, kode: "L-" + Date.now().toString(36).toUpperCase(), urutan: "A→B" };
      const kode = "P" + String(d.next++).padStart(2, "0"), urutan = chooseOrder(d.rows, d.pending);
      d.pending[kode] = { urutan, t: Date.now() }; pvSave(d); return { ok: true, kode, urutan };
    },
    async submit(url, rec) {
      if (url) return call(url, {}, { action: "submit", rec });
      const d = pv(); d.rows[rec.kode] = rec; delete d.pending[rec.kode]; pvSave(d); return { ok: true };
    },
    async list(url, key) {
      if (url) return (await call(url, { action: "list", key })).rows;
      return Object.values(pv().rows);
    },
    async remove(url, key, kode) {
      if (url) return call(url, { action: "delete", key, kode });
      const d = pv(); delete d.rows[kode]; pvSave(d); return { ok: true };
    },
    chooseOrder
  };
})();

  shell(`<div class="hero"><h1>Terima kasih!</h1><p class="lead">Penilaianmu sudah kami terima dan akan membantu kami memilih desain SafeSpace yang paling mudah dipakai mahasiswa.</p></div>
<div class="card"><p class="muted">Kode anonim kamu</p><p style="font-family:'DM Serif Display',Georgia,serif;font-size:34px;color:var(--maroon);line-height:1">${esc(run.kode)}</p><p class="muted">Simpan jika kamu ingin datanya dihapus nanti. Hubungi peneliti dan sebutkan kode ini.</p></div>
<p class="note">Jawaban skrining tadi milik tokoh fiksi, jadi tidak menggambarkan kondisimu. Jika kamu sedang merasa tertekan, Layanan Psikologi FT UGM gratis untuk mahasiswa. Dalam keadaan darurat hubungi SEJIWA 119 ekstensi 8.</p>
<div class="card"><h3>Mau lihat aplikasi lengkapnya? <span class="muted">(opsional)</span></h3><p class="muted">Jelajahi login anonim, check-in mood, grafik tren, dan pengajuan konseling. Tidak ada yang direkam.</p><button class="ghost block" id="jl">Jelajahi SafeSpace</button></div>
<p class="muted">Kamu boleh menutup halaman ini.</p><button class="linkbtn" id="nw" style="align-self:center">Perangkat ini dipakai peserta lain? Mulai sesi baru</button>`, { stage: "done" });
  $("#nw").onclick = () => { run = null; store.set("ss_run", null); render(); };
  $("#jl").onclick = jelajah;
}
function jelajah() {
  document.body.classList.add("trial");
  app.innerHTML = `<div class="tview"><div class="tbar"><div class="tb-l"><span class="tag">Mode jelajah · tidak direkam</span><b>Aplikasi SafeSpace lengkap</b></div><button id="nx">Selesai</button></div>
<div class="tstage"><div class="phwrap" id="ph"></div></div></div>`;
  mountPhone($("#ph"), { design: run.pref === "B" ? "B" : "A", full: innerWidth < 900, explore: true });
  $("#nx").onclick = () => render();
}
render();
}
</script>
