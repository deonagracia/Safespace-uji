<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4EC">
<title>SafeSpace · Studi kegunaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;
--bg:#F2F4EC;--bg2:#E6EBE0;--card:#FBFBF6;--ink:#2A2522;--body:#4A4440;--muted:#6B645E;--line:#D9D6CC;
--maroon:#8E1F14;--maroon2:#A3392C;--teal:#3F7373;--tealsoft:#D6E4E1;--warn:#FFF3D6;--warnink:#6B4510;--ok:#2F6B4F}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--teal);text-decoration:underline;font-weight:500;min-height:44px;padding:6px;cursor:pointer}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--body);font:16px/1.55 'DM Sans',Arial,sans-serif;overflow-x:clip}
h1,h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:var(--maroon);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,7vw,44px)}h2{font-size:clamp(24px,5vw,30px)}
h3{font-size:18px;color:var(--ink);margin:0}
p{margin:0}a{color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;align-self:flex-start;background:var(--teal);color:#F7FAF8;font-weight:700;font-size:13px;padding:3px 12px;border-radius:999px}
button,.btn{font:inherit;font-weight:700;min-height:48px;padding:10px 20px;border-radius:14px;border:2px solid var(--maroon);background:var(--maroon);color:#FBF3EF;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.ghost,.btn.ghost{background:transparent;color:var(--maroon)}
button.teal{background:var(--teal);border-color:var(--teal);color:#F7FAF8}
button.small{min-height:38px;padding:6px 14px;font-size:14px;border-radius:10px}
button.block{width:100%}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;color:var(--ink)}
select,input[type=text],input[type=password],input[type=url],textarea{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);min-height:48px;width:100%}
textarea{min-height:96px;resize:vertical}
.check{flex-direction:row;align-items:flex-start;gap:12px;font-weight:400;cursor:pointer}
.check input{width:24px;height:24px;margin-top:1px;flex:none;accent-color:var(--teal)}
.note{border-left:4px solid var(--maroon);padding:10px 14px;background:var(--card);border-radius:0 12px 12px 0}
.warn{background:var(--warn);color:var(--warnink);border-radius:12px;padding:12px 16px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;font-weight:500;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip.sel{background:var(--teal);border-color:var(--teal);color:#F7FAF8}
.sheet-bg{position:fixed;inset:0;background:rgba(20,18,16,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:86dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 20px 24px;display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.kartu table{width:100%;border-collapse:collapse;font-size:14px}
.kartu td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.kartu td:first-child{color:var(--muted);width:28px}
.kartu td:last-child{font-weight:700;color:var(--ink);text-align:right}
/* prototipe SafeSpace */
.phone{width:390px;height:min(800px,calc(100dvh - 150px));min-height:560px;border:10px solid #2A2522;border-radius:46px;background:#FBFBF6;color:#2A2522;overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone.full{width:100%;height:100%;min-height:0;border:0;border-radius:0}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 10px;font-size:15px;font-weight:700;color:#2A2522;background:#F2F4EC;flex:none}
.sbar .logo{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:20px;color:#8E1F14}
.sos{font:inherit;font-size:13px;font-weight:700;border:1.5px solid #8E1F14;color:#8E1F14;border-radius:999px;padding:4px 12px;background:transparent;min-height:34px}
.pad{padding:16px 18px 24px;display:flex;flex-direction:column;gap:12px}
.phone h4{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:28px;color:#8E1F14;margin:0;line-height:1.15}
.stem{font-size:14px;color:#6B645E}
.sec{font-size:13px;font-weight:700;color:#3F7373;margin-top:6px}
.item{background:#F2F4EC;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.item .qt{font-weight:500;color:#2A2522}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{font:inherit;font-size:14px;font-weight:500;min-height:46px;padding:8px;border-radius:10px;border:1.5px solid #3F7373;background:#FBFBF6;color:#3F7373;text-align:center;line-height:1.2;cursor:pointer}
.opt.sel{background:#3F7373;color:#F7FAF8}
.optv{font-size:16px;text-align:left;padding:12px 16px;min-height:56px}
.stick{position:sticky;top:0;z-index:2;background:#FBFBF6;padding:10px 18px;border-bottom:1px solid #D9D6CC;display:flex;flex-direction:column;gap:6px}
.stick .row{justify-content:space-between;flex-wrap:nowrap}
.back{font:inherit;font-size:15px;font-weight:700;border:0;background:none;color:#3F7373;padding:4px 0;min-height:36px;cursor:pointer}
.prog{height:8px;background:#D9D6CC;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:#8E1F14;border-radius:4px;transition:width .25s}
.pbtn{font:inherit;font-weight:700;min-height:52px;border-radius:14px;border:0;background:#8E1F14;color:#FBF3EF;width:100%;cursor:pointer}
.pbtn.alt{background:transparent;border:2px solid #3F7373;color:#3F7373}
.bnav{display:flex;justify-content:space-around;border-top:1px solid #D9D6CC;padding:8px 0 calc(10px + env(safe-area-inset-bottom));font-size:12px;color:#6B645E;background:#FBFBF6;flex:none}
.bnav b{color:#8E1F14}
.lvl{border-radius:14px;padding:12px;background:#F2F4EC;display:flex;flex-direction:column;gap:2px}
.lvl strong{font-size:22px;color:#8E1F14;font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.qcard{font-size:21px;font-weight:700;color:#2A2522;line-height:1.3}
.toast{position:absolute;left:12px;right:12px;bottom:76px;background:#2A2522;color:#F7FAF8;padding:10px 14px;border-radius:12px;font-size:14px;z-index:5}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}.sheet{animation:none}}

.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:'DM Serif Display',Georgia,serif;font-size:20px;color:var(--maroon)}
.stepno{font-size:13px;color:var(--muted);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:3px;transition:width .3s}
.hero{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.lead{font-size:18px;color:var(--ink)}
.plan{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.plan li{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.plan li::before{counter-increment:s;content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--tealsoft);color:var(--teal);font-weight:700;display:grid;place-items:center}
.plan b{color:var(--ink)}
.q{display:flex;flex-direction:column;gap:10px}
.q>p{font-weight:700;color:var(--ink)}
.foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:22px 0 calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:3}
.foot .muted{text-align:center}
.susq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s}
.susq.done{border-color:var(--teal)}
.susq p{color:var(--ink)}
.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.likert button{background:#fff;color:var(--teal);border:1.5px solid var(--line);padding:0;min-height:50px;font-size:18px;border-radius:12px}
.likert button.sel{background:var(--teal);color:#F7FAF8;border-color:var(--teal)}
.lk{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-card{font:inherit;text-align:left;align-items:stretch;justify-content:flex-start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;color:var(--body);min-height:0}
.opt-card.sel{border-color:var(--teal);background:var(--tealsoft)}
.opt-card b{color:var(--ink);font-size:16px}
.mini{height:96px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.mini i{display:block;height:9px;border-radius:3px;background:var(--line)}
.mini i.t{background:var(--teal);opacity:.55;width:70%}
.mini .big{height:26px;border-radius:5px;border:1.5px solid var(--teal);background:transparent}
.same{grid-column:1/-1}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--teal);animation:sp 0.9s linear infinite;align-self:center}
@keyframes sp{to{transform:rotate(360deg)}}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--tealsoft);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;align-self:flex-start}
.preview{background:#2A2522;color:#F2EDE7;font-size:13px;text-align:center;padding:6px 12px}
/* percobaan */
body.trial{overflow:hidden}
.tbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;background:#2A2522;color:#F2EDE7;flex:none}
.tbar b{font-size:15px}.tbar .muted{color:#BDB3A8;font-size:12px}
.tbar button{min-height:40px;padding:6px 14px;font-size:14px;border-radius:12px}
.tstage{flex:1;display:flex;justify-content:center;align-items:flex-start;gap:28px;min-height:0}
.tview{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.hint{background:var(--warn);color:var(--warnink);font-size:14px;padding:8px 14px;text-align:center;flex:none}
.side-kartu{width:300px;max-height:calc(100dvh - 120px);overflow:auto;margin-top:18px}
.tstage .phone{margin-top:18px}
@media(max-width:699px){.tstage{display:block}.side-kartu{display:none}.tstage .phone{margin:0;width:100%;height:100%;min-height:0;border:0;border-radius:0}.tstage>div{height:100%}}
@media(min-width:700px){.only-m{display:none}}
@media(max-width:999px) and (min-width:700px){.side-kartu{display:none}.only-m{display:inline-flex}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}.bar i{transition:none}}
details.card summary{cursor:pointer;min-height:40px;display:flex;align-items:center;color:var(--teal)}

</style>
</head>

<script>
const $ = (s, r = document) => r.querySelector(s);

const KARTU = { 1: [1, 2, 1, 0, 1, 2, 1, 1, 1, 2, 1, 0, 1, 2, 0, 0], 2: [2, 1, 0, 1, 2, 1, 1, 0, 2, 1, 1, 1, 2, 0, 1, 0] };
const PERSONA = { 1: "Dinda", 2: "Bima" };
const DNAME = { A: "Desain A · satu halaman", B: "Desain B · per halaman" };
const SUSQ = ["Saya rasa saya akan sering menggunakan fitur skrining ini.", "Saya merasa fitur skrining ini rumit tanpa perlu.", "Saya merasa fitur skrining ini mudah digunakan.", "Saya merasa butuh bantuan orang lain untuk bisa menggunakan fitur skrining ini.", "Saya merasa bagian-bagian fitur skrining ini menyatu dengan baik.", "Saya merasa ada terlalu banyak hal yang tidak konsisten di fitur skrining ini.", "Saya rasa kebanyakan orang akan cepat belajar menggunakan fitur skrining ini.", "Saya merasa fitur skrining ini merepotkan untuk digunakan.", "Saya merasa percaya diri saat menggunakan fitur skrining ini.", "Saya perlu mempelajari banyak hal sebelum bisa menggunakan fitur skrining ini."];
const DEMO = [["usia", "Usia", ["18–19", "20–21", "22–23", "≥ 24"]], ["jk", "Jenis kelamin", ["Perempuan", "Laki-laki", "Tidak ingin menjawab"]], ["angkatan", "Angkatan", ["2022", "2023", "2024", "2025", "Lainnya"]], ["app", "Seberapa sering Anda memakai aplikasi kesehatan di HP?", ["Hampir setiap hari", "Beberapa kali sebulan", "Pernah, tapi jarang", "Tidak pernah"]], ["skrining", "Pernah mengisi skrining psikologis online?", ["Pernah", "Belum"]], ["hp", "Rata-rata memakai HP per hari", ["< 3 jam", "3–6 jam", "> 6 jam"]]];
const DEPT = ["Teknik Biomedis", "Teknik Elektro", "Teknologi Informasi", "Teknik Sipil", "Teknik Lingkungan", "Teknik Mesin", "Teknik Industri", "Teknik Kimia", "Teknik Geologi", "Teknik Geodesi", "Arsitektur", "Perencanaan Wilayah dan Kota", "Teknik Fisika", "Teknik Nuklir"];
const susScore = a => a.every(v => v >= 1) ? 2.5 * a.reduce((s, v, i) => s + (i % 2 === 0 ? v - 1 : 5 - v), 0) : null;

function kartuHTML(k) {
  return `<div class="kartu"><span class="pill">Kartu Skenario ${k}</span><h3 style="margin-top:6px">Anda berperan sebagai ${PERSONA[k]}</h3><p class="muted">Dalam 2 minggu terakhir, ${PERSONA[k]} mengalami hal berikut. Pilih jawaban persis seperti di kartu.</p><table>${ITEMS.map((it, i) => `<tr><td>${i + 1}</td><td>${esc(it[2])}</td><td>${OPTS[KARTU[k][i]]}</td></tr>`).join("")}</table></div>`;

function openSheet(html, { onClose, closeText = "Tutup" } = {}) {
  const o = document.createElement("div"); o.className = "sheet-bg";
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${html}<button class="ghost block" data-x>${closeText}</button></div>`;
  const close = () => { o.remove(); document.removeEventListener("keydown", key); onClose && onClose(); };
  const key = e => { if (e.key === "Escape") close(); };
  o.addEventListener("click", e => { if (e.target === o || e.target.closest("[data-x]")) close(); });
  document.addEventListener("keydown", key);
  document.body.append(o); return { el: o, close };
}

/* Prototipe SafeSpace: Desain A (satu halaman) dan Desain B (per halaman) */
function mountPhone(host, { design, kartu, full, onStart, onDone }) {
  const ph = document.createElement("div"); ph.className = "phone" + (full ? " full" : ""); host.replaceChildren(ph);
  const st = { ans: Array(16).fill(null), koreksi: 0, kembali: 0, t0: null, t1: null, i: 0, lock: false };
  const sbar = `<div class="sbar"><span class="logo">SafeSpace</span><button class="sos" data-a="sos">Bantuan darurat</button></div>`;
  const bnav = `<div class="bnav"><span>Beranda</span><b>Skrining</b><span>Tren</span></div>`;
  const toast = msg => { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; ph.append(t); setTimeout(() => t.remove(), 2600); };
  const intro = () => {
    ph.innerHTML = sbar + `<div class="screen"><div class="pad"><p class="stem">Kode anonim: SS-4821</p><h4>Skrining singkat</h4><p>16 pertanyaan tentang kondisi Anda dalam 2 minggu terakhir. Perkiraan waktu 4 menit. Jawaban tersimpan dengan kode anonim, bukan nama atau NIM.</p><div class="lvl"><p>7 pertanyaan tentang kecemasan dan 9 tentang suasana hati.</p></div><button class="pbtn" data-a="mulai">Mulai skrining</button></div></div>` + bnav;
  };
  const itemHTML = i => `<div class="item"><p class="qt">${i + 1}. ${esc(ITEMS[i][1])}</p><div class="opts2">${OPTS.map((o, v) => `<button class="opt${st.ans[i] === v ? " sel" : ""}" data-i="${i}" data-v="${v}" aria-pressed="${st.ans[i] === v}">${o}</button>`).join("")}</div></div>`;
  const renderA = () => {
    const n = st.ans.filter(v => v != null).length;
    ph.innerHTML = sbar + `<div class="screen"><div class="stick"><div class="row"><b>Skrining</b><span data-cnt>${n} dari 16 terjawab</span></div><div class="prog"><i style="width:${n / 16 * 100}%"></i></div></div><div class="pad"><p class="stem">Dalam 2 minggu terakhir, seberapa sering Anda terganggu oleh hal berikut?</p><p class="sec">Bagian 1 · Kecemasan</p>${[0, 1, 2, 3, 4, 5, 6].map(itemHTML).join("")}<p class="sec">Bagian 2 · Suasana hati</p>${[7, 8, 9, 10, 11, 12, 13, 14, 15].map(itemHTML).join("")}<button class="pbtn" data-a="lihat">Lihat hasil</button></div></div>` + bnav;
  };

const API = (() => {
  const PKEY = "ss_preview_db";
  const pv = () => store.json(PKEY, { next: 1, rows: {}, pending: {} });
  const pvSave = d => store.set(PKEY, JSON.stringify(d));
  function chooseOrder(rows, pending) {
    const now = Date.now(), c = { "A→B": 0, "B→A": 0 };
    Object.values(rows).forEach(r => { if (!r.latihan && c[r.urutan] != null) c[r.urutan]++; });
    Object.values(pending).forEach(p => { if (now - p.t < 45 * 60e3 && c[p.urutan] != null) c[p.urutan]++; });
    return c["A→B"] <= c["B→A"] ? "A→B" : "B→A";
  }
  async function call(url, params, body) {
    const q = new URLSearchParams(params).toString();
    const res = await fetch(url + (url.includes("?") ? "&" : "?") + q, body ? { method: "POST", body: JSON.stringify(body) } : {});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json(); if (!j.ok) throw new Error(j.error || "gagal");
    return j;
  }
  return {
    preview: url => !url,
    async assign(url, latihan) {
      if (url) return call(url, { action: "assign", latihan: latihan ? 1 : 0 });
      const d = pv();
      if (latihan) return { ok: true, kode: "L-" + Date.now().toString(36).toUpperCase(), urutan: "A→B" };
      const kode = "P" + String(d.next++).padStart(2, "0"), urutan = chooseOrder(d.rows, d.pending);
      d.pending[kode] = { urutan, t: Date.now() }; pvSave(d); return { ok: true, kode, urutan };
    },
    async submit(url, rec) {
      if (url) return call(url, {}, { action: "submit", rec });
      const d = pv(); d.rows[rec.kode] = rec; delete d.pending[rec.kode]; pvSave(d); return { ok: true };
    },
    async list(url, key) {
      if (url) return (await call(url, { action: "list", key })).rows;
      return Object.values(pv().rows);
    },
    async remove(url, key, kode) {
      if (url) return call(url, { action: "delete", key, kode });
      const d = pv(); delete d.rows[kode]; pvSave(d); return { ok: true };
    },
    chooseOrder
  };
})();

    $("#go").onclick = send;
    addEventListener("online", () => { if (run.step === "send") send(); }, { once: true });
  }
}
function done() {
  shell(`<div class="hero"><h1>Terima kasih!</h1><p class="lead">Jawaban Anda sudah kami terima. Bantuan Anda membuat aplikasi ini lebih mudah dipakai mahasiswa lain.</p></div>
<div class="card"><p class="muted">Kode anonim Anda</p><p style="font-family:'DM Serif Display',Georgia,serif;font-size:34px;color:var(--maroon);line-height:1">${esc(run.kode)}</p><p class="muted">Simpan jika Anda ingin datanya dihapus nanti. Hubungi peneliti dan sebutkan kode ini.</p></div>
<p class="note">Jika Anda sedang merasa tertekan, Layanan Psikologi FT UGM gratis untuk mahasiswa. Dalam keadaan darurat hubungi SEJIWA 119 ekstensi 8.</p>
<p class="muted">Anda boleh menutup halaman ini.</p><button class="linkbtn" id="nw" style="align-self:center">Perangkat ini dipakai peserta lain? Mulai sesi baru</button>`, { stage: "done" });
  $("#nw").onclick = () => { run = null; store.set("ss_run", null); render(); };
}
render();
}

</script>
</body>
</html>
