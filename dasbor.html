<style>

.share small{font-size:13px;color:#5E6A6E;line-height:1.4}

.share button.on{border-color:#2F6F6B;background:#F3F8F7}
.share button.on .dot{border-color:#2F6F6B;background:radial-gradient(circle,#2F6F6B 0 5px,#fff 6px)}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.pbtn.danger{background:#B3412F}
.linkbtn2{font:inherit;font-size:14px;font-weight:700;background:none;border:0;color:#2F6F6B;padding:0;min-height:32px;cursor:pointer;align-self:flex-start}
.lvl{border-radius:16px;padding:14px;background:#F1F4F2;display:flex;flex-direction:column;gap:6px}

.meter{height:8px;background:#E1E6E4;border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:#2F6F6B;border-radius:4px}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.qcard{font-size:21px;font-weight:700;color:#1F2A2E;line-height:1.3}
.role{background:#FFF3D6;color:#6B4510;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500}

/* Penyimpanan: Google Apps Script, atau mode pratinjau (data di browser ini) */
const API = (() => {
  const PKEY = "ss_preview_db";
  const pv = () => store.json(PKEY, { next: 1, rows: {}, pending: {} });
  const pvSave = d => store.set(PKEY, JSON.stringify(d));
  function chooseOrder(rows, pending) {
    const now = Date.now(), c = { "A→B": 0, "B→A": 0 };
    Object.values(rows).forEach(r => { if (!r.latihan && c[r.urutan] != null) c[r.urutan]++; });
    Object.values(pending).forEach(p => { if (now - p.t < 45 * 60e3 && c[p.urutan] != null) c[p.urutan]++; });
    return c["A→B"] <= c["B→A"] ? "A→B" : "B→A";
  }
  async function call(url, params, body) {
    const q = new URLSearchParams(params).toString();
    const res = await fetch(url + (url.includes("?") ? "&" : "?") + q, body ? { method: "POST", body: JSON.stringify(body) } : {});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json(); if (!j.ok) throw new Error(j.error || "gagal");
    return j;
  }
  return {
    preview: url => !url,
    async assign(url, latihan) {
      if (url) return call(url, { action: "assign", latihan: latihan ? 1 : 0 });
      const d = pv();
      if (latihan) return { ok: true, kode: "L-" + Date.now().toString(36).toUpperCase(), urutan: "A→B" };
      const kode = "P" + String(d.next++).padStart(2, "0"), urutan = chooseOrder(d.rows, d.pending);
      d.pending[kode] = { urutan, t: Date.now() }; pvSave(d); return { ok: true, kode, urutan };
    },
    async submit(url, rec) {
      if (url) return call(url, {}, { action: "submit", rec });
      const d = pv(); d.rows[rec.kode] = rec; delete d.pending[rec.kode]; pvSave(d); return { ok: true };
    },
    async list(url, key) {
      if (url) return (await call(url, { action: "list", key })).rows;
      return Object.values(pv().rows);
    },
    async remove(url, key, kode) {
      if (url) return call(url, { action: "delete", key, kode });
      const d = pv(); delete d.rows[kode]; pvSave(d); return { ok: true };
    },
    chooseOrder
  };
})();

  $("#dl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + toCSV(list)], { type: "text/csv" })); a.download = "safespace-uji-desain.csv"; document.body.append(a); a.click(); a.remove(); };

    const k = b.dataset.del, sh = openSheet(`<h3>Hapus data ${esc(k)}?</h3><p>Baris ini dihapus dari Google Sheet dan tidak bisa dikembalikan. Lakukan hanya jika peserta meminta atau datanya rusak.</p><button id="yes">Hapus permanen</button>`, { closeText: "Batal" });
    $("#yes", sh.el).onclick = async () => { $("#yes", sh.el).disabled = true; try { await API.remove(url(), cfg.key, k); sh.close(); load(); } catch (e) { $("#yes", sh.el).textContent = "Gagal, coba lagi"; $("#yes", sh.el).disabled = false; } };
  });
}
function desain(host) {
  host.innerHTML = `<h1>Coba desain</h1><p class="muted">Mode bebas untuk demo dan tangkapan layar. Tidak ada data yang disimpan.</p>
<div class="desk"><div class="card"><h3>Pilih desain</h3><div class="seg"><button id="dA" class="${demoState.d === "A" ? "on" : ""}">Desain A</button><button id="dB" class="${demoState.d === "B" ? "on" : ""}">Desain B</button></div><label>Kartu pembanding<select id="kt"><option value="">Tanpa kartu</option><option value="1" ${demoState.kartu === "1" ? "selected" : ""}>Kartu 1 · ${PERSONA[1]}</option><option value="2" ${demoState.kartu === "2" ? "selected" : ""}>Kartu 2 · ${PERSONA[2]}</option></select></label><label class="check" style="flex-direction:row;align-items:center;gap:10px;font-weight:500"><input type="checkbox" id="fx" ${demoState.full ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--teal)"> Aplikasi lengkap (login, beranda, tren, konseling)</label><p class="muted">${demoState.d === "A" ? "16 butir dalam satu gulir, penghitung terjawab menempel di atas." : "Satu butir per layar, progress bar, otomatis lanjut 0,3 detik setelah memilih."}</p>${demoState.kartu ? kartuHTML(demoState.kartu) : ""}</div><div id="ph"></div>
<div class="card"><h3>Pengukuran</h3><p class="timer" id="tm">0,0 dtk</p><p id="rs" class="muted">Tekan “Mulai skrining”.</p><button class="ghost" id="ul">Ulangi</button></div></div>`;
  let iv = null;
  const start = () => { clearInterval(iv); $("#tm").textContent = "0,0 dtk"; $("#rs").textContent = "Tekan “Mulai skrining”.";
    mountPhone($("#ph"), { design: demoState.d, kartu: demoState.full ? null : (demoState.kartu || null), explore: demoState.full,
      onStart: t0 => { iv = setInterval(() => { if (!document.body.contains($("#tm"))) return clearInterval(iv); $("#tm").textContent = fmt((performance.now() - t0) / 1000, 1) + " dtk"; }, 100); },
      onDone: r => { clearInterval(iv); $("#tm").textContent = fmt(r.waktu, 1) + " dtk"; $("#rs").textContent = `${r.peringatan ? r.peringatan + "× diingatkan soal kosong, " : ""}${r.salah != null ? `${r.salah} tidak sesuai kartu, ` : ""}${r.koreksi} koreksi${r.desain === "B" ? `, ${r.kembali}× kembali` : ""}.`; } }); };
  start();
  $("#dA").onclick = () => { demoState.d = "A"; desain(host); }; $("#dB").onclick = () => { demoState.d = "B"; desain(host); };
  $("#kt").onchange = e => { demoState.kartu = e.target.value; desain(host); }; $("#fx").onchange = e => { demoState.full = e.target.checked; desain(host); }; $("#ul").onclick = start;
}
function pengaturan() {
  return `<h1>Pengaturan</h1><div class="card"><h3>Koneksi</h3><p>${cfg.preview ? "Sedang memakai <b>mode pratinjau</b>: data dibaca dari browser ini." : `Terhubung ke Apps Script:<br><span class="muted" style="word-break:break-all">${esc(cfg.url)}</span>`}</p><div class="row"><button class="ghost small" id="sw">${cfg.preview ? "Hubungkan ke Apps Script" : "Ganti URL atau kunci"}</button><button class="ghost small" id="lo">Keluar dari perangkat ini</button></div></div>
${cfg.preview ? "" : `<div class="card"><h3>Link masuk cepat</h3><p class="muted">Link dasbor yang sudah berisi kunci. Buka sekali di perangkat baru (HP Anda, laptop anggota kelompok) dan dasbor langsung terbuka tanpa mengetik kunci.</p><p class="warn">Siapa pun yang memegang link ini bisa melihat semua data. Kirim hanya lewat chat pribadi, jangan di grup.</p><div class="copy"><input type="text" readonly id="ml" value="${esc(location.origin + location.pathname + "#kunci=" + encodeURIComponent(cfg.key || ""))}"><button class="small" data-copy="ml">Salin</button></div><p class="muted" id="cm"></p></div>`}
<div class="card"><h3>Link peserta</h3><p class="muted">Isi setelah halaman peserta di-hosting (mis. GitHub Pages). Dipakai untuk tombol salin di Ringkasan.</p><div class="copy"><input type="url" id="lk" value="${esc(cfg.link || "")}" placeholder="${esc(new URL("index.html", location.href).href)}"><button class="small" id="sv">Simpan</button></div><p class="muted" id="sm"></p></div>
${cfg.preview ? `<div class="card"><h3>Data pratinjau</h3><p class="muted">Hapus semua data uji coba yang tersimpan di browser ini.</p><button class="ghost small" id="rp">Kosongkan data pratinjau</button></div>` : ""}`;
}
function bindSet() {
  bindCopy();
  $("#sw").onclick = () => { cfg.preview = false; if (!cfg.url) cfg.url = BAKED; cfg.key = ""; saveCfg(); loaded = false; render(); };
  $("#lo").onclick = () => { cfg = BAKED ? { url: BAKED, key: "", preview: false, link: cfg.link } : null; store.set("ss_owner", cfg ? JSON.stringify(cfg) : null); rows = []; loaded = false; render(); };
  $("#sv").onclick = () => { const v = $("#lk").value.trim(); if (v && !/^https?:\/\//.test(v)) { $("#sm").textContent = "Link harus diawali https://"; return; } cfg.link = v; saveCfg(); $("#sm").textContent = "Tersimpan."; };
  if ($("#rp")) $("#rp").onclick = () => { const sh = openSheet(`<h3>Kosongkan data pratinjau?</h3><p>Semua sesi uji coba di browser ini dihapus.</p><button id="yes">Kosongkan</button>`, { closeText: "Batal" }); $("#yes", sh.el).onclick = () => { store.set("ss_preview_db", null); sh.close(); load(); }; };
}
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && cfg && loaded) load(true); });
render();
if (cfg && (cfg.preview || (cfg.url && cfg.key))) load();
timer = setInterval(() => { if (!document.hidden && cfg && (cfg.preview || cfg.url) && view() !== "desain") load(true); }, 30000);
}

</script>
